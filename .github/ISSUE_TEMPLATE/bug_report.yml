name: Bug report
description: Report reproducible behavior that looks wrong
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a problem. Do not attach logs containing prompts, responses, tool results, credentials, or other private data.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Tell us what you expected and what happened instead.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start codex-hop with...
        2. Type...
        3. See...
    validations:
      required: true

  - type: input
    id: codex-version
    attributes:
      label: Codex client version
      placeholder: 0.149.0
    validations:
      required: true

  - type: input
    id: node-version
    attributes:
      label: Node.js version
      placeholder: 22.15.0
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Windows 11 24H2
    validations:
      required: true

  - type: textarea
    id: diagnostics
    attributes:
      label: Sanitized diagnostics
      description: Include only metadata needed to reproduce the issue. Remove conversation content, credentials, IDs, file paths, and personal data.
      render: shell

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed prompts, responses, tool results, credentials, private identifiers, and personal file paths.
          required: true

